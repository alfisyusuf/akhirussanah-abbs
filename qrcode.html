<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro QR Code Generator (High Quality)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <style>
        /* Memastikan preview tetap kecil meskipun resolusi asli besar */
        #qr-container canvas, #qr-container svg {
            max-width: 100% !important;
            height: auto !important;
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4">

    <div class="max-w-4xl mx-auto flex flex-col md:flex-row gap-8">
        
        <!-- Panel Kontrol -->
        <div class="bg-white p-6 rounded-2xl shadow-xl flex-1">
            <h1 class="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                <span class="bg-blue-600 text-white p-1 rounded">QR</span> Generator Pro
            </h1>

            <div class="space-y-5">
                <!-- Input Teks -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">URL atau Konten Teks</label>
                    <textarea id="qr-text" rows="3" placeholder="https://sekolahanda.sch.id" 
                              class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all"></textarea>
                </div>

                <!-- Upload Logo -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Logo Sekolah (PNG/JPG)</label>
                    <input type="file" id="qr-logo" accept="image/*" 
                           class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <!-- Pengaturan Resolusi -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Kualitas (Pixel)</label>
                        <select id="qr-size" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none">
                            <option value="300">300px (Standard)</option>
                            <option value="600">600px (Medium)</option>
                            <option value="1200" selected>1200px (High Definition)</option>
                            <option value="2000">2000px (Ultra HD/Cetak)</option>
                        </select>
                    </div>
                    <!-- Format File -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Format Download</label>
                        <select id="qr-extension" class="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none">
                            <option value="png">PNG (Gambar Biasa)</option>
                            <option value="svg">SVG (Vektor - Anti Pecah)</option>
                            <option value="jpeg">JPEG</option>
                        </select>
                    </div>
                </div>

                <button id="btn-generate" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all transform active:scale-95">
                    GENERATE QR CODE
                </button>
            </div>
        </div>

        <!-- Panel Preview & Download -->
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full md:w-80 flex flex-col items-center">
            <h2 class="text-lg font-semibold text-slate-700 mb-4 text-center">Preview</h2>
            
            <div id="qr-container" class="bg-slate-50 w-full aspect-square rounded-xl border-2 border-dashed border-slate-200 flex items-center justify-center overflow-hidden mb-6">
                <span class="text-slate-400 text-sm p-4 text-center">QR Code akan muncul di sini setelah klik Generate</span>
            </div>

            <button id="btn-download" disabled
                    class="w-full bg-emerald-500 hover:bg-emerald-600 disabled:bg-slate-200 disabled:text-slate-400 text-white font-bold py-3 rounded-xl shadow-md transition-all">
                DOWNLOAD HASIL
            </button>
            <p class="text-[10px] text-slate-400 mt-4 text-center">Tips: Gunakan format <b>SVG</b> jika ingin mencetak pada baliho atau banner berukuran besar.</p>
        </div>

    </div>

    <script>
        let currentLogo = "";
        
        // Setup awal QRCodeStyling
        const qrCode = new QRCodeStyling({
            width: 1200,
            height: 1200,
            type: "canvas",
            data: "",
            image: "",
            dotsOptions: {
                color: "#000000",
                type: "rounded"
            },
            backgroundOptions: {
                color: "#ffffff",
            },
            imageOptions: {
                crossOrigin: "anonymous",
                margin: 10,
                imageSize: 0.4
            },
            qrOptions: {
                errorCorrectionLevel: "H"
            }
        });

        const qrText = document.getElementById('qr-text');
        const qrLogo = document.getElementById('qr-logo');
        const qrSize = document.getElementById('qr-size');
        const qrExtension = document.getElementById('qr-extension');
        const btnGenerate = document.getElementById('btn-generate');
        const btnDownload = document.getElementById('btn-download');
        const qrContainer = document.getElementById('qr-container');

        // Handle Image Upload
        qrLogo.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    currentLogo = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Action Generate
        btnGenerate.addEventListener('click', () => {
            const val = qrText.value.trim();
            if(!val) return alert("Isi teks atau URL dulu!");

            const size = parseInt(qrSize.value);
            
            qrCode.update({
                data: val,
                image: currentLogo,
                width: size,
                height: size
            });

            qrContainer.innerHTML = "";
            qrCode.append(qrContainer);
            btnDownload.disabled = false;
        });

        // Action Download
        btnDownload.addEventListener('click', () => {
            const ext = qrExtension.value;
            qrCode.download({ 
                name: "QR_Sekolah_HighRes", 
                extension: ext 
            });
        });
    </script>
</body>
</html>
