<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel MC - Akhirussanah</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Lora:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f59e0b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header & Lompat Kelas */
        header {
            padding: 15px;
            background: #111827;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            white-space: nowrap;
        }

        select {
            flex: 1;
            padding: 10px 12px;
            background: var(--card);
            color: white;
            border: 1px solid #475569;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            outline: none;
        }

        /* Main Display Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .info-label {
            font-size: 16px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        /* Lencana Akhir Kelas */
        .end-badge {
            background-color: #ef4444; /* Merah terang */
            color: white;
            padding: 8px 16px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .student-name {
            font-size: clamp(28px, 8vw, 42px);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 30px;
            color: white;
            width: 100%;
        }

        .parent-container {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--accent);
            width: 100%;
            max-width: 500px;
        }

        .parent-status {
            font-family: 'Lora', serif;
            font-size: 18px;
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 5px;
        }

        .parent-name {
            font-family: 'Lora', serif;
            font-size: clamp(22px, 6vw, 32px);
            font-weight: 700;
            color: var(--accent);
        }

        /* Navigation Buttons */
        footer {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: #111827;
            border-top: 1px solid #334155;
        }

        .nav-btn {
            padding: 22px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 800;
            color: white;
            cursor: pointer;
            transition: transform 0.1s;
            letter-spacing: 1px;
        }

        .nav-btn:active { transform: scale(0.95); }
        .btn-prev { background-color: #475569; }
        .btn-next { background-color: #1d4ed8; }

        .progress-footer {
            grid-column: span 2;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-label">Lompat ke:</div>
        <select id="class-select" onchange="jumpToClass()"></select>
    </header>

    <main id="mc-display">
        <div class="info-label" id="current-class">KELAS ...</div>
        
        <div class="end-badge" id="end-class-badge" style="display: none;">AKHIR KELAS</div>
        
        <div class="student-name" id="student-name">Memuat Data...</div>
        
        <div class="parent-container">
            <div class="parent-status" id="parent-prefix">Putra/Putri dari</div>
            <div class="parent-name" id="parent-name">-</div>
        </div>
    </main>

    <footer>
        <button class="nav-btn btn-prev" onclick="nav(-1)">PREV</button>
        <button class="nav-btn btn-next" onclick="nav(1)">NEXT</button>
        <div class="progress-footer" id="progress-text">Siswa 0 dari 0</div>
    </footer>

    <script>
        let allData = [];
        let idx = 0;

        fetch('data_siswa.json')
            .then(res => res.json())
            .then(data => {
                allData = data;

                // Setup Dropdown Lompat Kelas
                const classes = [...new Set(data.map(s => s.Kelas))].sort((a,b) => 
                    parseInt(a.replace('XII ','')) - parseInt(b.replace('XII ',''))
                );
                
                const select = document.getElementById('class-select');
                classes.forEach(c => {
                    let opt = document.createElement('option');
                    opt.value = c; 
                    opt.textContent = c;
                    select.appendChild(opt);
                });

                updateView();
            });

        function jumpToClass() {
            const val = document.getElementById('class-select').value;
            // Cari index pertama dari kelas yang dipilih
            const targetIdx = allData.findIndex(s => s.Kelas === val);
            if (targetIdx !== -1) {
                idx = targetIdx;
                updateView();
            }
        }

        function nav(dir) {
            let newIdx = idx + dir;
            // Selama masih di dalam batas total semua siswa
            if (newIdx >= 0 && newIdx < allData.length) {
                idx = newIdx;
                updateView();
            }
        }

        function updateView() {
            if (allData.length === 0) return;
            const s = allData[idx];
            
            // Logic Gender Siswa & Ortu (Otomatis)
            const numKelas = parseInt(s.Kelas.replace('XII ', ''));
            let statusAnak = (numKelas >= 7 && numKelas <= 12) ? "Putri" : "Putra";
            
            let statusOrtu = "Bapak";
            const daftarIbu = ["Linda Novianti", "Endang Tri Haryani", "Heny Dwi Hantoro", "Yuni Rudito", "Yuli Purnomo"];
            if (daftarIbu.includes(s["Nama Orang Tua"])) statusOrtu = "Ibu";

            // Update Teks Layar
            document.getElementById('student-name').textContent = s.Nama;
            document.getElementById('parent-name').textContent = s["Nama Orang Tua"];
            document.getElementById('parent-prefix').textContent = `${statusAnak} dari ${statusOrtu}`;
            document.getElementById('current-class').textContent = `KELAS ${s.Kelas}`;
            document.getElementById('progress-text').textContent = `Urutan: ${idx + 1} dari total ${allData.length} siswa`;
            
            // Sinkronkan dropdown dengan kelas siswa yang sedang tampil
            document.getElementById('class-select').value = s.Kelas;

            // LOGIKA AKHIR KELAS
            let isEndOfClass = false;
            // Jika ini siswa terakhir di seluruh data
            if (idx === allData.length - 1) {
                isEndOfClass = true;
            } 
            // Atau jika kelas siswa BERIKUTNYA berbeda dengan kelas siswa INI
            else if (allData[idx].Kelas !== allData[idx + 1].Kelas) {
                isEndOfClass = true;
            }

            const badge = document.getElementById('end-class-badge');
            if (isEndOfClass) {
                badge.style.display = 'inline-block';
                badge.textContent = `⚠️ SISWA TERAKHIR DI KELAS ${s.Kelas}`;
            } else {
                badge.style.display = 'none';
            }
            
            // Vibrate feedback (Getaran) jika HP mendukung
            if (window.navigator.vibrate) window.navigator.vibrate(30);
        }
    </script>
</body>
</html>
